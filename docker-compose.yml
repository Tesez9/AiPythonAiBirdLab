services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: bird
      RABBITMQ_DEFAULT_PASS: birdpass
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ai_server:
    build:
      context: .
      dockerfile: Dockerfile.ai
    ports:
      - "8001:8001"
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,sys,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)); sys.exit(0 if data.get('status') == 'ok' else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      RABBIT_URL: amqp://bird:birdpass@rabbitmq/
      DATABASE_URL: sqlite:////app/bird_lab.db
      UPLOAD_DIR: /app/uploads
      BIRD_INFO_FILE: /app/bird_info.json
    volumes:
      - ./bird_lab.db:/app/bird_lab.db
      - ./uploads:/app/uploads
      - ./input:/app/input:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      AI_SERVER_URL: http://ai_server:8001
      DATABASE_URL: sqlite:////app/bird_lab.db
      RABBIT_URL: amqp://bird:birdpass@rabbitmq/
      UPLOAD_DIR: /app/uploads
      BIRD_INFO_FILE: /app/bird_info.json
    volumes:
      - ./bird_lab.db:/app/bird_lab.db
      - ./uploads:/app/uploads
      - ./input:/app/input:ro
    depends_on:
      ai_server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,sys,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); sys.exit(0 if data.get('status') == 'ok' else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  hf_cache:
